name: Semiconductor News Automation

on:
  schedule:
    # 매일 한국 시간 기준 오전 7시 17분 실행 (UTC 22:17)
    # GitHub Actions 사용량이 몰리는 정각을 피하여 예약 실행 누락 가능성을 줄임
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: '수집 범위(시간). 평소에는 24, 누락 복구 시에만 48'
        required: false
        default: '24'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          # main.py의 databases.query API와 호환되는 Notion SDK 버전 고정
          pip install feedparser beautifulsoup4 requests "notion-client==2.5.0" openai

      - name: 파이썬 자동화 스크립트 실행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
        run: |
          python main.py
